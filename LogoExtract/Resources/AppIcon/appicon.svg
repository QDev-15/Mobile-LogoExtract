<?xml version="1.0" encoding="UTF-8"?>
<!-- App icon background: mint brand gradient, PrimaryDark (#27E3A3, "brighter mint" token) in the top-left
     corner to Tertiary (#1A6B50, "darker-than-Primary brand shade" token) in the bottom-right; same diagonal
     light-to-dark gradient approach as DocScanner's appicon.svg, adapted to LogoExtract's own mint tokens
     instead of introducing new one-off hexes. The foreground extraction mark sits on top. -->
<svg width="456" height="456" viewBox="0 0 456 456" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#27E3A3"/>
      <stop offset="1" stop-color="#1A6B50"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="456" height="456" fill="url(#bg)"/>
</svg>
