<!-- App icon background (design agent, 2026-10-28 icon-replacement pass): dark chocolate-brown gradient,
     matching the owner's reference image closely ("thay logo bằng icon này" — a close recreation, not a
     loose variant this time; see appiconfg.svg's own comment for the full brief). Sampled directly from the
     reference PNG (scratchpad pixel probe): the tile reads as a near-flat #392B26 brown; this gradient's two
     stops average to almost exactly that value, so it keeps the portfolio's own "every appicon.svg is a
     diagonal light-to-dark gradient" convention (see the git history of this exact file) while still landing
     visually on the reference's flat brown. No app-wide Colors.xaml token exists for this brown (by design —
     this task is scoped to the icon/splash mark only, not a re-theme of the rest of the app's mint UI), so it
     is a deliberate one-off literal here, same way PdfReader/DocScanner's own appicon.svg gradients are
     one-off literals rather than resource references (SVG can't consume XAML DynamicResource anyway). -->
