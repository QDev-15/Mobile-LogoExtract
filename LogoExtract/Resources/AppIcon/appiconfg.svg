<?xml version="1.0" encoding="UTF-8"?>
<!-- App icon foreground: a dashed "cutout selection" square (the outline traced around the logo on the
     fabric, with two drag-handle nodes on it) sits behind a solid white square: the clean extracted /
     vectorized logo, offset up-and-right with a flat drop shadow so it reads as "lifted off and finished".
     One small accent anchor-point dot on the solid shape echoes the ghost's handles, nodding to the app's
     vectorize step. Everything stays inside the Android adaptive-icon safe zone (the central ~61%: 89..367
     on this 456 canvas), same convention and safe-zone box as DocScanner's appiconfg.svg. -->
<svg width="456" height="456" viewBox="0 0 456 456" xmlns="http://www.w3.org/2000/svg">
  <!-- ghost cutout outline: the selection traced around the logo on the fabric it was lifted from -->
  <rect x="118" y="208" width="140" height="140" rx="30" fill="none" stroke="#FFFFFF" stroke-opacity="0.55"
        stroke-width="16" stroke-dasharray="20 14" stroke-linecap="round"/>
  <!-- drag-handle nodes on the ghost outline -->
  <rect x="127" y="339" width="18" height="18" rx="4" fill="#FFFFFF"/>
  <rect x="231" y="339" width="18" height="18" rx="4" fill="#FFFFFF"/>
  <!-- flat drop shadow under the extracted shape (no blur filter, kept as a plain offset fill for renderer safety) -->
  <rect x="178" y="118" width="168" height="168" rx="34" fill="#000000" fill-opacity="0.18"/>
  <!-- the clean extracted / vectorized logo shape, lifted up and out of the selection -->
  <rect x="170" y="108" width="168" height="168" rx="34" fill="#FFFFFF"/>
  <!-- decorative young-leaf accent filling the plain white interior. Owner liked Snapseed's own faceted,
       layered-green leaf mark as a style reference (screenshot, 2026-10-27): a gem-cut leaf built from flat
       color facets, light green at the tip shading to dark green at the base. Reusing that FACETED/GRADIENT
       CONSTRUCTION here, but deliberately with this app's own facet layout/proportions and only LogoExtract's
       own mint-family tones (tints/shades built around the existing PrimaryDark/Primary/Tertiary tokens)
       rather than Snapseed's own teal/lime palette: close enough in spirit to land the look the owner pointed
       at, distinct enough not to reproduce Snapseed's specific, trademarked mark on a public Play Store icon.
       Built as 8 explicit flat polygons (4 rows x left/right), NOT a rect+clip-path: Svg.Skia (the renderer
       MAUI's resizetizer uses to build the launcher icon at compile time) silently drops clip-path content,
       confirmed by inspecting the actual rasterized obj/.../resizetizer output (the leaf was just gone), so
       every facet here is its own plain closed path instead, which is also a more authentic low-poly/gem-cut
       construction than a curved silhouette would have been anyway. -->
  <g transform="translate(235,206) rotate(-10)">
    <path d="M0,-58 L-3,-58 L-24,-26 L0,-26 Z" fill="#79D1B3"/>
    <path d="M0,-58 L3,-58 L24,-26 L0,-26 Z" fill="#9FE8CB"/>
    <path d="M0,-26 L-24,-26 L-32,0 L0,0 Z" fill="#3BC99A"/>
    <path d="M0,-26 L24,-26 L32,0 L0,0 Z" fill="#27E3A3"/>
    <path d="M0,0 L-32,0 L-24,26 L0,26 Z" fill="#1A8F6B"/>
    <path d="M0,0 L32,0 L24,26 L0,26 Z" fill="#1FAE82"/>
    <path d="M0,26 L-24,26 L-3,58 L0,58 Z" fill="#124A38"/>
    <path d="M0,26 L24,26 L3,58 L0,58 Z" fill="#1A6B50"/>
  </g>
  <!-- finished vector anchor-point accent -->
  <circle cx="322" cy="130" r="11" fill="#1A6B50"/>
</svg>
